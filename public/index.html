<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jonah OST</title>
<meta name="description" content="Jonah OST radio: one shuffled stream of Jonah's music that everyone hears at the same time.">
<meta property="og:title" content="Jonah OST">
<meta property="og:description" content="Tune in to Jonah's music, live on shuffle.">
<meta name="theme-color" content="#ffd43b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffd43b'/%3E%3Cpath d='M12 9v14l11-7z' fill='%23141b4d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Figtree:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
[hidden] { display: none !important; }
.band { padding-top: env(safe-area-inset-top, 0px); }

/* Layout: a daytime FM station. Big wordmark on a sunny band, the record on air with a tuning dial as its progress bar, the queue, and the owner's desk. */
:root {
  --bg: #eef2ff;
  --band: #ffd43b;
  --surface: #ffffff;
  --raise: #e2e7fb;
  --fg: #141b4d;
  --muted: #5a6290;
  --line: #d3d9f2;
  --accent: #2f4bff;
  --accent-ink: #ffffff;
  --live: #ff3d5a;
  --danger: #e0303f;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Figtree", "Helvetica Neue", system-ui, sans-serif;
  --mono: "Space Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.5; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.gut { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Sunny band */
.band { background: var(--band); border-bottom: 3px solid var(--fg); }
header { padding-block: 18px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 16px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; }
h1 { margin: 0; font-family: var(--body); font-weight: 700; font-size: 28px; line-height: 1.1; letter-spacing: -.01em; color: var(--fg); }
h1 span { color: var(--accent); }
.strip { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 14px; font-weight: 600; }
.onair { display: inline-flex; align-items: center; gap: 7px; background: var(--live); color: #fff; padding: 4px 12px 4px 10px; border-radius: 999px; font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.onair i { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: pulse 1.4s ease-in-out infinite; }
.onair.off { background: var(--fg); } .onair.off i { animation: none; opacity: .5; }
.pill { background: var(--surface); border: 2px solid var(--fg); border-radius: 999px; padding: 2px 12px; font-size: 13px; }
.pill:empty { display: none; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

.wrap { padding-block: 28px 56px; display: flex; flex-direction: column; gap: 32px; }

/* On air */
.stage { display: flex; flex-direction: column; gap: 20px; }
.cover { width: calc(100% - 10px); max-width: 100%; aspect-ratio: 1; border-radius: 18px; object-fit: cover; background: var(--raise); display: block; border: 3px solid var(--fg); box-shadow: 10px 10px 0 var(--band), 10px 10px 0 3px var(--fg); }
.now { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.now .label { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.now h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(24px, 6.5vw, 32px); line-height: 1.1; letter-spacing: -.02em; text-wrap: balance; overflow-wrap: anywhere; }

/* Tuning dial */
.prog { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.dial { position: relative; height: 34px; background: var(--surface); border: 2px solid var(--fg); border-radius: 10px; overflow: hidden;
  background-image: repeating-linear-gradient(90deg, var(--fg) 0 2px, transparent 2px 100%), repeating-linear-gradient(90deg, var(--muted) 0 1px, transparent 1px 100%);
  background-size: 20% 14px, 4% 7px; background-repeat: repeat-x; background-position: 0 100%, 0 100%; }
.dial i { position: absolute; top: 0; left: 0; height: 100%; width: 0; background: color-mix(in srgb, var(--accent) 14%, transparent); }
.dial b { position: absolute; top: -2px; bottom: -2px; left: 0; width: 3px; margin-left: -1.5px; background: var(--live); }
.scale { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--muted); }
.times { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tune { display: inline-flex; justify-content: center; align-items: center; gap: 10px; padding: 16px 20px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); font-family: var(--display); font-weight: 700; font-size: 17px; border: 3px solid var(--fg); box-shadow: 0 5px 0 var(--fg); transition: transform .08s, box-shadow .08s; }
.tune svg { width: 20px; height: 20px; }
.tune.on { background: var(--surface); color: var(--fg); }
.tune:disabled { opacity: .45; cursor: default; }
.hint { font-size: 14px; color: var(--muted); text-align: center; margin: -8px 0 0; }

/* Up next */
.card { background: var(--surface); border: 2px solid var(--fg); border-radius: 16px; padding: 6px 16px; }
.sect-h { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; font-family: var(--display); font-size: 15px; font-weight: 700; }
.sect-h span:last-child { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.list { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.thumb { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background: var(--raise); display: block; }
.name { min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.when { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

.note { font-size: 14px; color: var(--muted); margin: 0; }


/* Volume */
.vol { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 2px solid var(--fg); border-radius: 14px; padding: 10px 14px; }
.vol svg { width: 22px; height: 22px; flex-shrink: 0; color: var(--fg); transition: transform .2s ease; }
.vol:hover svg { transform: scale(1.12) rotate(-6deg); }
.vol output { font-family: var(--mono); font-size: 13px; font-weight: 700; width: 3ch; text-align: right; font-variant-numeric: tabular-nums; }
input[type=range].slider { flex: 1; min-width: 0; margin: 0; height: 24px; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
.slider::-webkit-slider-runnable-track { height: 8px; border-radius: 999px; border: 2px solid var(--fg); background: linear-gradient(var(--accent), var(--accent)) 0/var(--p, 80%) 100% no-repeat, var(--raise); }
.slider::-moz-range-track { height: 6px; border-radius: 999px; border: 2px solid var(--fg); background: var(--raise); }
.slider::-moz-range-progress { height: 6px; border-radius: 999px; background: var(--accent); }
.slider::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -9px; border-radius: 50%; background: var(--band); border: 3px solid var(--fg); transition: transform .15s ease; }
.slider::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--band); border: 3px solid var(--fg); transition: transform .15s ease; }
.slider:hover::-webkit-slider-thumb { transform: scale(1.15); }
.slider:active::-webkit-slider-thumb { transform: scale(1.3); }
.slider:hover::-moz-range-thumb { transform: scale(1.15); }
.slider:active::-moz-range-thumb { transform: scale(1.3); }
.volnote { font-size: 13px; color: var(--muted); margin: -12px 0 0; text-align: center; }

/* Motion */
.btn, .pill, .thumb, .cover, details.desk, .mrow input { transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease, color .18s ease, border-color .18s ease, filter .18s ease; }
.tune { transition: transform .12s ease, box-shadow .12s ease, background-color .2s ease, color .2s ease, filter .2s ease; }
.tune:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--fg); filter: brightness(1.06); }
.tune:not(:disabled):active { transform: translateY(4px); box-shadow: 0 1px 0 var(--fg); }
.tune svg { transition: transform .25s cubic-bezier(.3,1.6,.5,1); }
.tune:not(:disabled):hover svg { transform: scale(1.18); }
.btn:hover { transform: translateY(-2px); box-shadow: 0 4px 0 color-mix(in srgb, var(--fg) 25%, transparent); }
.btn:active { transform: translateY(1px) scale(.96); box-shadow: none; }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.cover:hover { transform: rotate(-1.5deg) translate(-3px, -3px); box-shadow: 14px 14px 0 var(--band), 14px 14px 0 3px var(--fg); }
.pill:hover { transform: translateY(-2px); }
.onair { transition: transform .2s ease; } .onair:hover { transform: scale(1.06); }
.row { transition: background-color .2s ease, padding .2s ease; border-radius: 10px; }
.row:hover { background: var(--bg); padding-left: 8px; padding-right: 8px; }
.row:hover .thumb { transform: scale(1.08) rotate(-3deg); }
.row, .mrow, .qitem { animation: rise .35s ease both; }
.list .row:nth-child(2) { animation-delay: .05s; } .list .row:nth-child(3) { animation-delay: .1s; } .list .row:nth-child(4) { animation-delay: .15s; }
details.desk:hover { border-color: var(--fg); }
details.desk > summary { transition: color .18s ease; } details.desk > summary:hover { color: var(--accent); }
details.desk[open] .deskbody { animation: rise .3s ease both; }
.mrow input:focus { border-color: var(--accent); }
.swap { animation: swapIn .5s cubic-bezier(.2,.8,.2,1) both; }
.dial b { transition: left .5s linear; } .dial i { transition: width .5s linear; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes swapIn { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
@media (min-width: 560px) { .stage { display: grid; grid-template-columns: 210px 1fr; gap: 28px; align-items: end; } .tune, .hint, .vol, .volnote { grid-column: 1 / -1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

</style>
</head>
<body>
<div class="band"><div class="gut">
  <header>
    <h1>Jonah OST</h1>
    <div class="strip">
      <span class="onair off" id="onair"><i></i><span id="onairText">Off air</span></span>
      <span class="pill" id="libcount"></span>
    </div>
  </header>
</div></div>


<div class="wrap gut">
  <section class="stage" id="stage">
    <img class="cover" id="cover" alt="">
    <div class="now">
      <span class="label">On air now</span>
      <h2 id="nowTitle">Loading the station…</h2>
      <div class="prog">
        <div class="dial" aria-hidden="true"><i id="progBar"></i><b id="needle"></b></div>
        <div class="scale" aria-hidden="true"><span>88</span><span>92</span><span>96</span><span>100</span><span>104</span><span>108</span></div>
        <div class="times"><span id="tNow">0:00</span><span id="tLeft">-0:00</span></div>
      </div>
    </div>
    <div class="vol">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <input type="range" class="slider" id="vol" min="0" max="100" value="80" aria-label="Volume">
      <output id="volVal" for="vol">80</output>
    </div>
    <p class="volnote" id="volNote" hidden>On iPhone, use the volume buttons on the side of your phone.</p>
    <button class="tune" id="tune" type="button" disabled>
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" id="tuneIcon"><path d="M7 4.5v15l13-7.5z"/></svg>
      <span id="tuneText">Tune in</span>
    </button>
    <p class="hint" id="hint">Everyone listening hears the same song at the same moment.</p>
  </section>

  <section class="card">
    <div class="sect-h"><span>Up next</span><span>Starts in</span></div>
    <div class="list" id="next"></div>
  </section>

</div>

<audio id="audio" preload="none" playsinline></audio>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const audio = $("audio");
  const PLAY = '<path d="M7 4.5v15l13-7.5z"/>';
  const STOP = '<path d="M6 6h12v12H6z"/>';
  const EPOCH = Date.UTC(2026, 10, 1); // the station's first broadcast; the schedule counts from here

  let tracks = [];          // from songs.json, built from the songs folder on every deploy
  let loaded = false;
  let clockOffset = 0;      // server time minus this device's time, in ms
  let tuned = false;
  let loadedId = null;

  const fmt = (s) => { if (!isFinite(s) || s < 0) s = 0; s = Math.floor(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  const now = () => Date.now() + clockOffset;

  function sleeve(title) {
    let h = 0; for (const c of title) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    const a = h % 360, b = (a + 40 + (h >> 8) % 80) % 360;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="hsl(${a} 35% 22%)"/><circle cx="${10 + (h % 20)}" cy="${12 + ((h >> 4) % 18)}" r="${10 + ((h >> 6) % 10)}" fill="hsl(${b} 60% 55%)" opacity=".85"/></svg>`;
    return "data:image/svg+xml," + encodeURIComponent(svg);
  }
  function setImg(img, t) { const s = sleeve(t ? t.title : "Jonah OST"); if (img.getAttribute("src") !== s) img.src = s; }

  // ---------- The shared schedule ----------
  // Every visitor's page computes the same shuffled running order from the song list and the clock,
  // so nothing has to stay running: the station is on whenever anyone looks.
  function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const playable = () => tracks.filter((t) => t.duration >= 1).sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  function rawOrder(list, n) {
    const r = mulberry((n * 2654435761) ^ (list.length * 97)), o = list.slice();
    for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; }
    return o;
  }
  function cycleOrder(list, n) {
    const o = rawOrder(list, n);
    if (o.length > 2) { const prev = rawOrder(list, n - 1); if (prev[prev.length - 1].id === o[0].id) [o[0], o[1]] = [o[1], o[0]]; }
    return o;
  }
  function onAir(ms, ahead = 0) {
    const list = playable(); if (!list.length) return null;
    const L = list.reduce((s, t) => s + t.duration, 0);
    const e = (ms - EPOCH) / 1000;
    let n = Math.floor(e / L), pos = e - n * L;
    let order = cycleOrder(list, n), i = 0;
    while (i < order.length - 1 && pos >= order[i].duration) { pos -= order[i].duration; i++; }
    const cur = { track: order[i], offset: Math.min(pos, order[i].duration) };
    const queue = []; let start = order[i].duration - cur.offset, j = i + 1, cn = n;
    while (queue.length < ahead) {
      if (j >= order.length) { cn++; order = cycleOrder(list, cn); j = 0; }
      queue.push({ track: order[j], startsIn: start }); start += order[j].duration; j++;
      if (queue.length >= list.length * 2) break;
    }
    cur.queue = queue; return cur;
  }

  // ---------- Display ----------
  let lastNextKey = "";
  function paint() {
    const s = onAir(now(), 4), has = !!s;
    $("onair").classList.toggle("off", !has);
    $("onairText").textContent = has ? "On air" : "Off air";
    $("tune").disabled = !has;
    const n = playable().length;
    $("libcount").textContent = n ? `${n} ${n === 1 ? "song" : "songs"} in rotation` : "";
    if (!has) {
      $("nowTitle").textContent = loaded ? "No songs yet" : "Loading the station…";
      setImg($("cover"), null); $("progBar").style.width = "0"; $("needle").style.left = "0";
      $("tNow").textContent = "0:00"; $("tLeft").textContent = "-0:00";
      $("next").innerHTML = loaded ? '<p class="note" style="padding:12px 0">The station starts broadcasting once songs are added.</p>' : "";
      return;
    }
    const t = s.track;
    if ($("nowTitle").textContent !== t.title) {
      const h = $("nowTitle"), c = $("cover");
      h.textContent = t.title;
      for (const el of [h, c]) { el.classList.remove("swap"); void el.offsetWidth; el.classList.add("swap"); }
    }
    setImg($("cover"), t);
    const pct = (100 * s.offset / t.duration).toFixed(2) + "%"; $("progBar").style.width = pct; $("needle").style.left = pct;
    $("tNow").textContent = fmt(s.offset); $("tLeft").textContent = "-" + fmt(t.duration - s.offset);
    const key = s.queue.map((q) => q.track.id).join("|");
    if (key !== lastNextKey) {
      lastNextKey = key; const box = $("next"); box.innerHTML = "";
      s.queue.forEach((q) => {
        const r = document.createElement("div"); r.className = "row";
        const img = document.createElement("img"); img.className = "thumb"; img.alt = ""; setImg(img, q.track);
        const nm = document.createElement("span"); nm.className = "name"; nm.textContent = q.track.title;
        const w = document.createElement("span"); w.className = "when";
        r.append(img, nm, w); box.appendChild(r);
      });
    }
    const ws = $("next").querySelectorAll(".when");
    s.queue.forEach((q, i) => { if (ws[i]) ws[i].textContent = fmt(q.startsIn); });
  }

  // ---------- Volume ----------
  (() => {
    const v = $("vol");
    let start = 80;
    try { const sv = localStorage.getItem("jonah-vol"); if (sv !== null && isFinite(+sv)) start = Math.max(0, Math.min(100, +sv)); } catch {}
    const apply = (n) => { v.value = String(n); $("volVal").textContent = String(n); v.style.setProperty("--p", n + "%"); audio.volume = n / 100; };
    apply(start);
    // iPhones only take volume from the hardware buttons; the page can't change it there.
    audio.volume = 0.5; const fixed = audio.volume === 1; audio.volume = start / 100;
    if (fixed) { v.closest(".vol").hidden = true; $("volNote").hidden = false; }
    v.addEventListener("input", () => { apply(+v.value); try { localStorage.setItem("jonah-vol", v.value); } catch {} });
  })();

  // ---------- Listening ----------
  function setTuneUI() {
    $("tune").classList.toggle("on", tuned);
    $("tuneIcon").innerHTML = tuned ? STOP : PLAY;
    $("tuneText").textContent = tuned ? "Stop listening" : "Tune in";
  }
  let switchingUntil = 0;
  function load(s) {
    switchingUntil = Date.now() + 2000;
    loadedId = s.track.id;
    audio.src = s.track.file;
    setMediaSession(s.track);
  }
  function catchUp() {
    if (!tuned) return;
    const s = onAir(now()); if (!s) return;
    if (s.track.id !== loadedId) { load(s); audio.play().catch(() => {}); return; }
    if (audio.readyState >= 1 && Math.abs(audio.currentTime - s.offset) > 2) { try { audio.currentTime = s.offset; } catch {} }
  }
  function tuneIn() {
    const s = onAir(now()); if (!s) return;
    tuned = true; setTuneUI();
    if (loadedId !== s.track.id || !audio.src) load(s);
    audio.play().catch(() => { tuned = false; setTuneUI(); });  // must start inside the tap on iPhone
    if (audio.readyState >= 1) catchUp();
  }
  function tuneOut() { tuned = false; audio.pause(); setTuneUI(); }
  $("tune").onclick = () => (tuned ? tuneOut() : tuneIn());

  audio.addEventListener("loadedmetadata", catchUp);
  audio.addEventListener("canplay", catchUp);
  audio.addEventListener("ended", () => { loadedId = null; catchUp(); });
  audio.addEventListener("pause", () => { if (tuned && Date.now() > switchingUntil && !audio.ended && audio.src && document.visibilityState === "visible" && audio.readyState > 2) { tuned = false; setTuneUI(); } });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") catchUp(); });

  function setMediaSession(t) {
    if (!("mediaSession" in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: "Jonah OST", album: "Jonah OST Radio" });
      navigator.mediaSession.setActionHandler("play", () => tuneIn());
      navigator.mediaSession.setActionHandler("pause", () => tuneOut());
      for (const a of ["previoustrack", "nexttrack", "seekbackward", "seekforward", "seekto"]) { try { navigator.mediaSession.setActionHandler(a, null); } catch {} }
    } catch {}
  }

  // Line this device's clock up with the server, so everyone lands on the same second.
  async function syncClock() {
    const samples = [];
    for (let k = 0; k < 3; k++) {
      try {
        const t0 = Date.now();
        const r = await fetch("songs.json?t=" + t0, { method: "HEAD", cache: "no-store" });
        const t1 = Date.now(), d = r.headers.get("date");
        if (d) samples.push(Date.parse(d) + 500 - (t0 + t1) / 2);
      } catch {}
    }
    if (samples.length) { samples.sort((a, b) => a - b); const o = samples[Math.floor(samples.length / 2)]; if (Math.abs(o) > 750) clockOffset = o; }
  }

  // ---------- Boot ----------
  async function loadSongs() {
    try {
      const r = await fetch("songs.json", { cache: "no-cache" });
      if (!r.ok) throw new Error(String(r.status));
      const list = await r.json();
      tracks = Array.isArray(list) ? list.filter((t) => t && t.file && t.duration >= 1) : [];
    } catch {
      $("hint").textContent = "The song list couldn't load. Check your connection and reload the page.";
    }
    loaded = true; lastNextKey = ""; paint(); catchUp();
  }

  setTuneUI(); paint();
  setInterval(paint, 500);
  setInterval(catchUp, 5000);
  loadSongs().then(syncClock).then(() => { paint(); catchUp(); });
})();
</script>
</body>
</html>
